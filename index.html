<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kage No Teio</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<canvas id="bg-canvas" style="position:fixed;inset:0;z-index:0"></canvas>
<div id="waveLayer" class="wave-layer"></div>
<div id="toast"></div>

<!-- ══ NAV ══ -->
<div class="top-nav">
  <button class="nav-btn active"    data-page="main">الرئيسية</button>
  <button class="nav-btn"           data-page="slime">سلايم</button>
  <button class="nav-btn"           data-page="chat">محادثات</button>
  <button class="nav-btn"           data-page="archive">الارشيف</button>
  <button class="nav-btn"           data-page="profile">ملف الشخصي</button>
</div>

<!-- ══ PROFILE ICON ══ -->
<div class="profile-header" id="profileHeader">
  <div class="profile-wrap" id="profileWrap">
    <canvas id="halo-canvas"></canvas>
    <div class="profile-name">
      <div class="profile-img" id="navProfileImg">
        <img src="20260420_113331.jpg" onerror="this.parentElement.innerHTML='&#x1F464;'">
      </div>
      <span id="profile-name-text">Kage No Teio</span>
    </div>
  </div>
</div>

<!-- ══ PAGES (iframes loaded on demand) ══ -->
<div id="page-main"    class="page active"><iframe data-src="pages/main.html"    style="width:100%;height:100%;border:none"></iframe></div>
<div id="page-slime"   class="page"><iframe data-src="pages/slime.html"   style="width:100%;height:100%;border:none"></iframe></div>
<div id="page-chat"    class="page"><iframe data-src="pages/chat.html"    style="width:100%;height:100%;border:none"></iframe></div>
<div id="page-archive" class="page"><iframe data-src="pages/archive.html" style="width:100%;height:100%;border:none"></iframe></div>
<div id="page-profile" class="page"><iframe data-src="pages/profile.html" style="width:100%;height:100%;border:none"></iframe></div>
<div id="page-admin"   class="page"><iframe data-src="pages/admin.html"   style="width:100%;height:100%;border:none"></iframe></div>

<!-- ══ POPUP (loads index2.html sections) ══ -->
<div id="popupMenu" class="popup-menu">
  <div class="popup-header">
    <span id="popupTitle" class="popup-title"></span>
    <button class="popup-close" onclick="closePopup()">✕ رجوع</button>
  </div>
  <div class="popup-body">
    <iframe id="popupFrame" src="about:blank" allowfullscreen></iframe>
  </div>
</div>

<script>
/* ══ BG CANVAS ══ */
(()=>{
  const cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d');
  let W,H,stars=[],bolts=[],phase=0,glitchT=0,glitchOn=false,gLines=[];
  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
  resize();addEventListener('resize',resize);
  const mkS=()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,
    spd:Math.random()*.08+.018,a:Math.random()*.7+.2,ts:Math.random()*.012+.003,
    td:Math.random()>.5?1:-1,col:Math.random()>.88?`rgba(255,${Math.random()*50|0},${Math.random()*50|0},`:'rgba(255,255,255,'});
  for(let i=0;i<280;i++)stars.push(mkS());
  for(let i=0;i<12;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,
    spd:Math.random()*.04+.01,a:Math.random()*.5+.3,ts:.016,td:1,col:'rgba(160,0,255,'});
  const pent=(x,y,r,rot,a)=>{
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    const pts=[];for(let i=0;i<5;i++){const θ=(i*4*Math.PI/5)-Math.PI/2;pts.push({x:Math.cos(θ)*r,y:Math.sin(θ)*r});}
    ctx.beginPath();for(let i=0;i<5;i++){ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[(i+2)%5].x,pts[(i+2)%5].y);}
    ctx.strokeStyle=`rgba(180,0,0,${a})`;ctx.lineWidth=1.5;ctx.shadowColor='#f00';ctx.shadowBlur=18;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*1.06,0,Math.PI*2);ctx.strokeStyle=`rgba(180,0,0,${a*.55})`;ctx.lineWidth=.8;ctx.shadowBlur=8;ctx.stroke();
    ctx.restore();
  };
  const spawnBolt=()=>{
    let cx=Math.random()*W,cy=0;const pts=[{x:cx,y:cy}];
    for(let i=0;i<(7+Math.random()*6|0);i++){cx+=(Math.random()-.5)*40;cy+=30+Math.random()*28;pts.push({x:cx,y:cy});}
    return{pts,life:1,decay:Math.random()*.14+.1};
  };
  const triggerGlitch=()=>{
    glitchOn=true;gLines=[];
    for(let i=0;i<(4+Math.random()*6|0);i++)gLines.push({y:Math.random()*H,h:2+Math.random()*12,shift:(Math.random()-.5)*30,r:Math.random()>.5});
    setTimeout(()=>glitchOn=false,120+Math.random()*180);
  };
  (function frame(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.85);
    bg.addColorStop(0,'#06000e');bg.addColorStop(.5,'#020008');bg.addColorStop(1,'#000');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    phase+=.003;
    const r=Math.min(W,H)*.26,ba=.12+Math.sin(phase)*.06;
    pent(W/2,H/2,r,phase,ba);pent(W/2,H/2,r*.6,-phase*1.3,ba*.7);
    for(const s of stars){
      s.a+=s.ts*s.td;if(s.a>.95||s.a<.08)s.td*=-1;
      s.y+=s.spd;if(s.y>H+4){s.y=-4;s.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=s.col+s.a+')';ctx.fill();
    }
    if(--glitchT<=0){if(Math.random()>.6){bolts.push(spawnBolt());triggerGlitch();}glitchT=(30+Math.random()*90)|0;}
    for(let i=bolts.length-1;i>=0;i--){
      const b=bolts[i];
      ctx.save();ctx.strokeStyle=`rgba(180,0,255,${b.life})`;ctx.lineWidth=1+b.life*.8;ctx.shadowColor='#c0f';ctx.shadowBlur=10+b.life*16;
      ctx.beginPath();ctx.moveTo(b.pts[0].x,b.pts[0].y);for(let j=1;j<b.pts.length;j++)ctx.lineTo(b.pts[j].x,b.pts[j].y);ctx.stroke();ctx.restore();
      b.life-=b.decay;if(b.life<=0)bolts.splice(i,1);
    }
    if(glitchOn)for(const g of gLines){const d=ctx.getImageData(0,g.y,W,g.h);ctx.putImageData(d,g.shift,g.y);if(g.r){ctx.fillStyle='rgba(255,0,0,.04)';ctx.fillRect(0,g.y,W,g.h);}}
    requestAnimationFrame(frame);
  })();
})();

/* ══ HALO ══ */
(()=>{
  const wrap=document.getElementById('profileWrap'),cv=document.getElementById('halo-canvas'),ctx=cv.getContext('2d');
  const nameEl=document.getElementById('profile-name-text');
  let W,H,bolts=[],boltT=0,phase=0;
  const resize=()=>{const r=wrap.getBoundingClientRect();W=r.width+60;H=r.height+60;cv.width=W;cv.height=H;cv.style.cssText=`width:${W}px;height:${H}px;left:-30px;top:-30px`};
  const spawnBolt=()=>{
    const top=Math.random()<.5,sx=30+Math.random()*(W-60),sy=top?30:H-30;
    const pts=[{x:sx,y:sy}];let cx=sx,cy=sy;
    for(let i=0;i<(4+Math.random()*5|0);i++){cx+=(Math.random()-.5)*24;cy+=(top?1:-1)*(10+Math.random()*9);pts.push({x:cx,y:cy});}
    return{pts,life:1,decay:Math.random()*.13+.09};
  };
  (function draw(){
    ctx.clearRect(0,0,W,H);phase+=.018;
    const gv=Math.min(1,.5+Math.sin(phase)*.3+(Math.random()>.93?Math.random()*.8:0));
    const gr=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,W/2);
    gr.addColorStop(0,`rgba(120,0,220,${(gv*.35).toFixed(2)})`);gr.addColorStop(.35,`rgba(90,0,180,${(gv*.18).toFixed(2)})`);
    gr.addColorStop(.7,`rgba(60,0,120,${(gv*.08).toFixed(2)})`);gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    const pad=14,rr=50;
    ctx.save();ctx.strokeStyle=`rgba(180,0,255,${(gv*.7).toFixed(2)})`;ctx.lineWidth=1.5+gv*1.5;
    ctx.shadowColor='#90f';ctx.shadowBlur=12+gv*18;
    ctx.beginPath();ctx.moveTo(pad+rr,pad);ctx.lineTo(W-pad-rr,pad);ctx.quadraticCurveTo(W-pad,pad,W-pad,pad+rr);
    ctx.lineTo(W-pad,H-pad-rr);ctx.quadraticCurveTo(W-pad,H-pad,W-pad-rr,H-pad);
    ctx.lineTo(pad+rr,H-pad);ctx.quadraticCurveTo(pad,H-pad,pad,H-pad-rr);
    ctx.lineTo(pad,pad+rr);ctx.quadraticCurveTo(pad,pad,pad+rr,pad);ctx.closePath();ctx.stroke();ctx.restore();
    if(--boltT<=0){if(Math.random()>.55)bolts.push(spawnBolt());boltT=(3+Math.random()*8)|0;}
    for(let i=bolts.length-1;i>=0;i--){
      const b=bolts[i];ctx.save();ctx.strokeStyle=`rgba(180,0,255,${b.life.toFixed(2)})`;ctx.lineWidth=1+b.life;ctx.shadowColor='#c0f';ctx.shadowBlur=8+b.life*12;
      ctx.beginPath();ctx.moveTo(b.pts[0].x,b.pts[0].y);for(let j=1;j<b.pts.length;j++)ctx.lineTo(b.pts[j].x,b.pts[j].y);ctx.stroke();ctx.restore();
      b.life-=b.decay;if(b.life<=0)bolts.splice(i,1);
    }
    nameEl.style.textShadow=`0 0 ${6+gv*10}px #c0f,0 0 ${12+gv*20}px #90f`;
    nameEl.style.color=`rgba(${180+gv*75|0},${100+gv*60|0},255,1)`;
    requestAnimationFrame(draw);
  })();
  setTimeout(()=>{resize();},100);addEventListener('resize',()=>setTimeout(resize,50));
})();

/* ══ NAVIGATION ══ */
let cur='main';
const profileHeader=document.getElementById('profileHeader');
const loadedPages=new Set(['main']);

// Load iframe src on first visit
function ensurePageLoaded(name){
  const page=document.getElementById('page-'+name);
  if(!page)return;
  const iframe=page.querySelector('iframe[data-src]');
  if(iframe&&!loadedPages.has(name)){
    iframe.src=iframe.dataset.src;
    loadedPages.add(name);
  }
}

function showPage(name,btn){
  playClick();
  document.getElementById('page-'+cur)?.classList.remove('active');
  cur=name;
  ensurePageLoaded(name);
  document.getElementById('page-'+name)?.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  profileHeader.classList.toggle('hidden',name!=='main');
}

document.querySelectorAll('.nav-btn[data-page]').forEach(btn=>{
  btn.addEventListener('click',()=>showPage(btn.dataset.page,btn));
});

// Ensure main page iframe is loaded
ensurePageLoaded('main');

/* ══ POPUP — loads index2.html with hash ══ */
// Sections map: key → hash/id to load in index2.html
const SECTION_MAP={
  'sinema'   :'sinema',
  'links'    :'links',
  'shadows'  :'shadows',
  'store'    :'store',
  'stories'  :'stories',
  'scandals' :'scandals',
};

function openPopup(sectionKey,title){
  playClick();
  document.getElementById('popupTitle').textContent=title;
  document.getElementById('popupFrame').src='index2.html#'+sectionKey;
  document.getElementById('popupMenu').classList.add('active');
}

function closePopup(){
  playClick();
  document.getElementById('popupMenu').classList.remove('active');
  document.getElementById('popupFrame').src='about:blank';
}

// Listen for messages from child pages / iframes
window.addEventListener('message',e=>{
  if(!e.data||typeof e.data!=='object')return;
  const {type,payload}=e.data;
  if(type==='openPopup') openPopup(payload.key,payload.title);
  if(type==='showPage')  showPage(payload.page,null);
  if(type==='openAdmin') openAdminGate(payload);
  if(type==='toast')     toast(payload);
  if(type==='updateNav') updateNavAvatar(payload);
});

/* ══ ADMIN GATE ══ */
function openAdminGate(data){
  // delegate to admin page
  ensurePageLoaded('admin');
  showPage('admin',null);
}

/* ══ NAV AVATAR UPDATE ══ */
function updateNavAvatar({name,avatar}={}){
  if(avatar){const el=document.getElementById('navProfileImg');el.innerHTML=`<img src="${avatar}">`;}
  if(name){document.getElementById('profile-name-text').textContent=name;}
}

/* ══ WAVE + CLICK SOUND ══ */
let AC,waveReady=true;
function playClick(){
  try{if(!AC)AC=new(AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=380;o.type='sine';g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);o.start();o.stop(AC.currentTime+.12);}catch(e){}
}
document.addEventListener('pointerdown',e=>{
  if(!waveReady)return;waveReady=false;
  const w=document.createElement('div');w.className='wave';w.style.left=e.clientX+'px';w.style.top=e.clientY+'px';
  document.getElementById('waveLayer').appendChild(w);
  setTimeout(()=>{w.remove();waveReady=true;},1200);
});
document.addEventListener('touchmove',e=>{
  if(!e.target.closest('.popup-body')&&!e.target.closest('.page'))e.preventDefault();
},{passive:false});

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);}
</script>
</body>
</html>
